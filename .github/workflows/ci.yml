name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Browser-only UI scripts never load under the test runner, so parse them explicitly.
      - name: Syntax-check every script
        run: for f in *.js; do node --check "$f" || exit 1; done
      - name: Run tests
        run: node --test tests/*.test.js
