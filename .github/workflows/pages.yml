name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          # Copy by glob so a new lab's page, script or stylesheet can't be left out.
          cp *.html *.css *.js manifest.json README.md CHANGELOG.md LICENSE _site/
          touch _site/.nojekyll
      - name: Check every precached asset shipped
        run: |
          for asset in $(grep -o '"\./[^"]*"' sw.js | tr -d '"' | sed 's|^\./||'); do
            test -f "_site/$asset" || { echo "sw.js precaches $asset but it is not in _site"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
